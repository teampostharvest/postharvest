# Default notification policy: route everything to the Webhook contact point,
# grouping by folder + alert name so a multi-service outage is one message.
apiVersion: 1

policies:
  - orgId: 1
    receiver: Webhook
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h