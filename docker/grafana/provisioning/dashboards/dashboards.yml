# Dashboard provider (D13): dashboards-as-code live in git under
# docker/grafana/dashboards (mounted at /var/lib/grafana/dashboards).
apiVersion: 1

providers:
  - name: postharvest
    orgId: 1
    folder: PostHarvest
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards