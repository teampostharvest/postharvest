# Internal-only stub_status listener for the nginx-prometheus-exporter (D16).
#
# The :80/:443 server blocks cannot host stub_status cleanly: :80 has a
# server-level `return 301` (which short-circuits every location) and scraping
# the :443 origin-cert listener would force TLS-skip-verify. So this private
# listener answers plain HTTP on 18080 INSIDE the container — compose never
# publishes it, and the allow-list still locks it to the docker networks
# (172.16.0.0/12 bridge + 10.0.0.0/8) in case anything inside tries to poke
# it from elsewhere. The exporter scrapes http://nginx:18080/stub_status.
#
# nginx.conf includes /etc/nginx/conf.d/*.conf, so mounting this file there
# (compose) is enough.

server {
    listen 18080;

    allow 172.16.0.0/12;
    allow 10.0.0.0/8;
    deny all;

    location /stub_status {
        stub_status;
        access_log off;
    }
}