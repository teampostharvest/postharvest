# postharvest — nginx server blocks (production profile).
#
#   /        -> frontend (:3000 Next.js standalone)
#   /api/*   -> backend   (:8000 FastAPI; already carries the /api prefix)
#   /docs    -> backend Swagger (open in dev; tighten before public launch)
#
# TLS: terminated here with the Cloudflare Origin certificate (certs/origin.pem
# + origin.key, bind-mounted at /etc/nginx/certs). Cloudflare talks to nginx
# over 443, so origin traffic is always encrypted; :80 just redirects.

server {
    listen 80;
    listen [::]:80;
    server_name postharvest.space www.postharvest.space _;

    # Redirect everything to HTTPS (Cloudflare also forces it on the edge).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name postharvest.space www.postharvest.space _;

    # Cloudflare Origin certificate (valid for *.postharvest.space).
    # PEM files must keep standard 64-char wrapping (OpenSSL rejects
    # single-line/unwrapped base64).
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Browser <-> Cloudflare is HTTPS already; HSTS applies at the origin so
    # Cloudflare's edge inherits the intent.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    include /etc/nginx/snippets/locations.conf;
}