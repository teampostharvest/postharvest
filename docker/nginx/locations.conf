# Shared proxy locations, included by both the :80 and :443 server blocks.
#
# Upstreams are resolved via Docker's embedded DNS (127.0.0.11) at runtime
# instead of nginx caching the container IPs once at startup. That way a
# `docker compose up --build` that recreates backend/frontend (new IPs) does
# not leave nginx proxying into the void — no manual nginx restart needed.

resolver 127.0.0.11 valid=10s ipv6=off;

set $backend_upstream  http://backend:8000;
set $backend_docs      http://backend:8000/docs;
set $frontend_upstream http://frontend:3000;

# ---- API (backend) ------------------------------------------------------
location /api/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket support: the session-capture viewer bridges CDP over /api.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Full path aliases that live under /api (health/docs) without a trailing
# slash — handled by the /api/ block above via the location match; keep
# /docs pointing to swagger only in non-prod.
location = /docs {
    proxy_pass $backend_docs;
}

# ---- Frontend (Next.js) -------------------------------------------------
location / {
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
}