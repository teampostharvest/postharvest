# docker-compose.prod.yml — PRODUCTION HARDENING LAYER (applied last).
#
# Usage (note: the explicit `-f` flags STOP the auto-loaded dev override):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#       --profile prod up -d --build
#
# Adds the hardening we deliberately do NOT ship in the base file so local
# dev (auto-loaded override) keeps writable bind mounts and a plain user:
#   * read-only root filesystem + tmpfs /tmp for runtime scratch
#   * drop ALL Linux capabilities + no-new-privileges (container break-out
#     hardening — the app never needs raw syscalls)
#   * per-service resource caps (RAM/CPU) so one scraper burst can't starve
#     the box
#   * Playwright launches Chromium with --no-sandbox (already in the code),
#     which pair correctly with dropped caps.
#
# postgres was removed from the stack when the database moved to managed
# Supabase (the backend connects over SUPABASE_DB_URL); nothing here needs
# PostgreSQL hardening anymore.

services:
  backend:
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-1.5}
    # Schema owner: apply pending Alembic migrations against the configured DB
    # before uvicorn boots (idempotent once the DB is stamped at head; the
    # one-time `alembic stamp head` for the pre-migration Supabase database is
    # documented in docs/DEPLOYMENT.md).
    command: >
      sh -c "alembic -c backend/alembic.ini upgrade head &&
             exec uvicorn backend.main:app --host 0.0.0.0 --port 8000"

  frontend:
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    cpus: ${FRONTEND_CPUS:-1.0}

  node:
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: ${NODE_MEM_LIMIT:-256m}
    cpus: ${NODE_CPUS:-0.5}

  redis:
    # Rate-limit buckets are loss-tolerant and tiny; cap so a burst can't
    # starve the box. No read_only/cap_drop here: redis writes its own /data
    # volume and the hardening pattern is for OUR app processes, not stores.
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    cpus: ${REDIS_CPUS:-0.5}

  nginx:
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: ${NGINX_MEM_LIMIT:-128m}