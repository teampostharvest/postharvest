# docker-compose.yml — PostHarvest (base = production topology)
#
# One compose file set serves BOTH local development and production:
#
#   LOCAL DEV  (auto-loaded docker-compose.override.yml):
#     docker compose up --build
#     -> backend  http://localhost:8000  (uvicorn --reload)
#        frontend http://localhost:3000  (next dev, hot reload)
#        redis    internal (shared rate-limit store)
#        node     internal (facebook-facing fetch service)
#        go       internal (idempotency cache in redis; USE_GO_WORKER off)
#
#   PRODUCTION (this file, nginx via --profile prod; override ignored):
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#         --profile prod up -d --build
#     -> nginx     :80/:443
#          /api/*  -> backend  (:8000 FastAPI)
#          /       -> frontend (:3000 Next.js standalone)
#        redis, node, go   internal, isolated network
#
# Service wiring:
#   web       network: nginx, frontend, backend, node   (browser-facing path)
#   isolated  network: backend, node, go, redis         (internal: no route out)
#
# The database is managed Supabase (SUPABASE_DB_URL), NOT a compose service.
# Playwright/Chromium is baked into the backend image. Job status/progress/
# cancel signals mirror to Redis (finalplanv2 §8b/§11 Phase 1); default
# JOB_EXECUTION=inline runs jobs on in-process worker threads (backend stays a
# single replica), and --profile worker + JOB_EXECUTION=arq opts into the
# out-of-process arq worker (backend/worker.py) for horizontal scaling.
name: postharvest

services:
  # =====================================================================
  # nginx — production entrypoint only (profile "prod"; skipped in dev)
  # TLS via Let's Encrypt/certbot; see deploy/nginx/README for the flow.
  # =====================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: postharvest-nginx
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/locations.conf:/etc/nginx/snippets/locations.conf:ro
      - ./nginx/stub_status.conf:/etc/nginx/conf.d/stub_status.conf:ro
      - ../certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # Probe HTTPS loopback (full proxy chain) with cert verification disabled:
      # :80 only 301-redirects to https, and the Cloudflare origin cert is not
      # trusted by wget's CA store, so a plain --spider on :80 always fails.
      test: ["CMD", "wget", "-q", "--no-check-certificate", "--spider", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =====================================================================
  # backend — FastAPI on :8000 (Playwright + Chromium + exporters)
  # # Produ/deployment hardening (read-only rootfs, dropped caps) lives in
  # docker-compose.prod.yml so local dev keeps writable bind mounts.
  # =====================================================================
  backend:
    build:
      context: ..
      # Dockerfile lives inside docker/; COPY paths in it are root-relative.
      dockerfile: docker/Dockerfile
      target: backend
      # Build over the host network: Docker's default bridge resolver returns
      # only AAAA for some CDNs (e.g. cdn.playwright.dev) and this host has no
      # IPv6, so `playwright install` fails with EAI_AGAIN. Build-time only —
      # the running container keeps its normal isolated network.
      network: host
    image: postharvest-backend:latest
    container_name: postharvest-backend
    init: true
    # Never inherit LAN DNS: the local router mangles Google/Firebase answers
    # (IPv6-only, unroutable), which wedged Firebase Auth and Supabase.
    # Pinned public resolvers — same disease as the build-time workaround above.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Live session-capture browser (remote-debug CDP). The CDP endpoint is
    # bound to loopback INSIDE the container and deliberately NOT published:
    # the API proxies the DevTools frontend and bridges the websocket
    # (/api/accounts/capture/{id}/...), so one capture at a time app-wide and
    # zero exposed ports.
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/postharvest.db}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-postharvest-firebase}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      DATA_DIR: ${DATA_DIR:-/app/data}
      EXPORT_BASE_DIR: ${EXPORT_BASE_DIR:-/app/data/exports}
      WORKER_THREADS: ${WORKER_THREADS:-4}
      MAX_URLS_PER_JOB: ${MAX_URLS_PER_JOB:-100}
      CANCEL_WAIT_SECONDS: ${CANCEL_WAIT_SECONDS:-5.0}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost","https://postharvest.space"]}'
      SCRAPER_DELAY_SECONDS: ${SCRAPER_DELAY_SECONDS:-2.5}
      SCRAPER_TIMEOUT_SECONDS: ${SCRAPER_TIMEOUT_SECONDS:-20}
      SCRAPER_MAX_RETRIES: ${SCRAPER_MAX_RETRIES:-3}
      SCRAPER_ROBOTS: ${SCRAPER_ROBOTS:-1}
      # node fetch seam (finalplanv2 §14): when USE_NODE=1 the
      # backend delegates HTTP-mode page fetches to the node service.
      # BASE_URL matches the compose service name on the stack network.
      USE_NODE: ${USE_NODE:-0}
      # Browser-mode seam: when USE_NODE_BROWSER=1, browser-mode scrapes
      # run through node's Playwright capture instead of the Python
      # browser_scraper (independent of USE_NODE).
      USE_NODE_BROWSER: ${USE_NODE_BROWSER:-0}
      NODE_BASE_URL: ${NODE_BASE_URL:-http://node:9334}
      # Cookie-less GraphQL feed walk (finalplanv2 §14): when GUEST_FEED_WALK=1
      # the backend walks public pages via node's Crawlee feed frames instead
      # of fetch+parse (guest requests only — no saved accounts involved).
      GUEST_FEED_WALK: ${GUEST_FEED_WALK:-0}
      # go compute seam (finalplanv2 §5/§14, M7): when USE_GO_WORKER=1 the
      # backend delegates the compute slice (parse -> normalize -> dedup) to
      # the go worker's POST /v1/parse.  Stays 0 by default — flips only
      # after parity is proven (same discipline as USE_NODE).
      USE_GO_WORKER: ${USE_GO_WORKER:-0}
      GO_WORKER_BASE_URL: ${GO_WORKER_BASE_URL:-http://go:8080}
      # Runtime TTL cache (finalplanv2 §8, slice C): >0 arms the backend's
      # in-process node-fetch consult seam for that many seconds per URL.
      # 0 (default) keeps it DISARMED — prod parity with the hermetic suites.
      SCRAPE_TTL_SECONDS: ${SCRAPE_TTL_SECONDS:-0}
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY:-}
      # Comma-separated emails auto-promoted to the ops role on first login.
      OPS_EMAILS: ${OPS_EMAILS:-}
      # Max seconds a server-side personal Facebook login may run.
      PERSONAL_LOGIN_TIMEOUT_SECONDS: ${PERSONAL_LOGIN_TIMEOUT_SECONDS:-90.0}
      # Live session capture (loopback CDP; proxied same-origin by the API).
      SESSION_CAPTURE_PORT: ${SESSION_CAPTURE_PORT:-9333}
      SESSION_CAPTURE_TIMEOUT_SECONDS: ${SESSION_CAPTURE_TIMEOUT_SECONDS:-240.0}
      # Redis job-state mirror + cancel coordination (finalplanv2 §8b/§11).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Execution backend: inline (this process) | arq (separate worker).
      JOB_EXECUTION: ${JOB_EXECUTION:-inline}
      ARQ_QUEUE_NAME: ${ARQ_QUEUE_NAME:-arq:queue}
      ARQ_JOB_TIMEOUT_SECONDS: ${ARQ_JOB_TIMEOUT_SECONDS:-21600}
      # Role for role-aware Postgres pool sizing (api | worker).
      PROCESS_ROLE: ${PROCESS_ROLE:-api}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Bind-mount the repo data/ dir so the CLI (host) and the container share
      # the same cookie store / exports. Keep the file layout identical to
      # local `cli.py login` (data/fb_cookies_*.json, data/exports/...).
      - ../data:/app/data
    healthcheck:
      # python:3.13-slim has no curl/wget; urllib is guaranteed present.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - web
      - isolated

  # =====================================================================
  # redis — job-state mirror, cancel coordination AND shared rate-limit
  # store (finalplanv2 §8b, §11 Phase 1).
  # Status/progress mirrors + cancel flags live here, along with node's
  # rate-limit buckets. No durability (save "" + appendonly no) — Postgres
  # owns durability and a Redis outage degrades every seam to pre-Redis
  # DB-only behaviour; the named volume keeps rate-limit buckets across
  # restarts. Memory is capped (allkeys-lru) so a lost-key storm cannot OOM
  # the VM. Internal-only: `isolated` network, reachable by nothing outside
  # the stack.
  # =====================================================================
  redis:
    image: redis:7.4-alpine
    container_name: postharvest-redis
    init: true
    restart: unless-stopped
    command: ["redis-server", "--save", '""', "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    networks:
      - isolated

  # =====================================================================
  # worker — optional out-of-process execution (JOB_EXECUTION=arq)
  # Same image as the backend, but runs the arq worker instead of the API
  # (finalplanv2 §8b/§11 Phase 1). Gated behind the `worker` profile so the
  # default single-process stack is unchanged; enable with:
  #   JOB_EXECUTION=arq docker compose --profile prod --profile worker up -d
  # It shares the backend's data volume (personal cookie jars) and DB/Redis
  # but serves no HTTP, so the API healthcheck is disabled.
  # =====================================================================
  worker:
    extends:
      service: backend
    container_name: postharvest-worker
    profiles:
      - worker
    command: ["arq", "backend.worker.WorkerSettings"]
    environment:
      JOB_EXECUTION: arq
      PROCESS_ROLE: worker
    healthcheck:
      disable: true

  # =====================================================================
  # frontend — Next.js standalone server on :3000
  # =====================================================================
  frontend:
    build:
      context: ..
      # Dockerfile lives inside docker/; COPY paths in it are root-relative.
      dockerfile: docker/Dockerfile
      target: frontend
      args:
        # Build-time only. In production the browser calls the SAME origin
        # (nginx /api/* -> backend), so empty = same-origin API_BASE — the
        # frontend already prefixes every request with /api/. Changing this
        # requires a rebuild.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://postharvest.space}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-postharvest-firebase}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    image: postharvest-frontend:latest
    container_name: postharvest-frontend
    init: true
    # Same pinned DNS as backend (see above) — the dev server must resolve
    # external hosts (fonts, Firebase) without the LAN resolver.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      # Documented for clarity; has no effect at runtime (baked at build).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - web

  # =====================================================================
  # node — Facebook-facing fetch service (finalplanv2 §4, §12)
  # The only service allowed to talk to Facebook. Internal-only: no published
  # ports; FastAPI will reach it at http://node:9334 once the
  # fetch-client seam lands. It needs the `web` network for outbound
  # facebook.com traffic and the `isolated` network to reach the internal
  # redis (shared rate-limit state) — same dual-network shape as backend.
  # =====================================================================
  node:
    build:
      # Self-contained service: its Dockerfile assumes node/ as the
      # build context (contra backend/frontend, whose docker/Dockerfile copies
      # relative to the repo root). package.json/lockfile/src all live here.
      context: ../node
      dockerfile: Dockerfile
      # Build-time DNS workaround — same disease as backend: the LAN resolver
      # returns AAAA-only answers for some CDNs (no IPv6 on this host), which
      # breaks `npm install` on the default bridge.
      network: host
    image: postharvest-node:latest
    container_name: postharvest-node
    init: true
    # Same pinned DNS as backend/frontend (LAN router mangles external answers).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      # Shared rate-limit store; the service degrades to in-process buckets on
      # a Redis outage (never hard-blocks fetching).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SCRAPER_DELAY_SECONDS: ${SCRAPER_DELAY_SECONDS:-2.5}
      SCRAPER_TIMEOUT_SECONDS: ${SCRAPER_TIMEOUT_SECONDS:-20}
      SCRAPER_MAX_RETRIES: ${SCRAPER_MAX_RETRIES:-3}
      SCRAPER_ROBOTS: ${SCRAPER_ROBOTS:-1}
    # Only service_started (not healthy): the fetcher must never hard-block on
    # Redis — it degrades to in-process buckets and /readyz reports the gap.
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 10s
    networks:
      - web
      - isolated

  # =====================================================================
  # go — compute worker (finalplanv2 §5, §8(c))
  # Stateless pure compute: POST /v1/parse + /healthz + /readyz, no
  # Facebook-facing traffic, no DB, no browser.  Internal-only: backend
  # reaches it at http://go:8080 once USE_GO_WORKER flips.  The optional
  # §8(c) idempotency cache lives in the shared Redis — a Redis outage is a
  # per-request best-effort miss, never a hard dependency (availability over
  # dedup), hence `service_started` like node.
  # =====================================================================
  go:
    build:
      # Self-contained context: golang/Dockerfile assumes golang/ as root.
      context: ../golang
      dockerfile: Dockerfile
    image: postharvest-go:latest
    container_name: postharvest-go
    init: true
    environment:
      PORT: "8080"
      # Unset/empty => single-shot mode (no cache); set => redis-backed.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 10s
    networks:
      - isolated

# =====================================================================
  # Monitoring platform (milestone plans/monitoring.md, ADRs D13–D17).
  #
  #   D13  Prometheus + Grafana OSS; dashboards + datasources provisioned
  #        as code from docker/grafana/provisioning (files in git).
  #   D14  Egress stays internal-only: `prometheus` joins BOTH `web` and
  #        `isolated` so it can scrape every service; `grafana` joins `web`
  #        only and reaches nothing but prometheus.
  #   D15  Nothing here publishes a port. Grafana is reached via SSH tunnel
  #        (ssh -L 3001:127.0.0.1:3001); /metrics stay unproxied by nginx.
  #   D16  nginx stub_status is allow-restricted to the docker networks.
  #   D17  Alerts are Grafana rules provisioned as code; the webhook URL
  #        comes from GRAFANA_ALERT_WEBHOOK_URL (empty => rules exist but
  #        the contact point is inert — no noise until a channel is set).
  #
  # Profile "mon": start the stack with
  #     docker compose --profile prod --profile mon up -d
  # =====================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: postharvest-prometheus
    profiles: ["mon"]
    restart: unless-stopped
    init: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      # prometheus runtime image is busybox-based: wget is guaranteed, python
      # is not. The landing page is a 200 when the server is up.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - web
      - isolated

  grafana:
    image: grafana/grafana-oss:11.4.2
    container_name: postharvest-grafana
    profiles: ["mon"]
    restart: unless-stopped
    init: true
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/postharvest-overview.json
      # Provisioned alert contact point (D17). Empty => the container gets a
      # dead-end discard URL (port 9) so the webhook validates and alert rules
      # provision; notifications only reach somewhere real once an operator
      # sets GRAFANA_ALERT_WEBHOOK_URL in docker/.env.
      GRAFANA_ALERT_WEBHOOK_URL: ${GRAFANA_ALERT_WEBHOOK_URL:-http://127.0.0.1:9/discard}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # No healthcheck: nothing depends on grafana, and the OSS image does not
    # guarantee a CLI HTTP client. Verification happens via the SSH tunnel.
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - web

  redis_exporter:
    # Canonical image: oliver006/redis_exporter. (There is no prom/redis-exporter
    # on Docker Hub — the prometheus org does not publish it.)
    image: oliver006/redis_exporter:v1.61.0
    container_name: postharvest-redis-exporter
    profiles: ["mon"]
    restart: unless-stopped
    init: true
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_started
    networks:
      - isolated

  nginx_exporter:
    # 0.x lineage scrapes OSS nginx `stub_status` over HTTP (the 1.x images
    # talk NGINX Plus gRPC only).
    image: nginx/nginx-prometheus-exporter:0.11.0
    container_name: postharvest-nginx-exporter
    profiles: ["mon"]
    restart: unless-stopped
    init: true
    environment:
      SCRAPE_URI: http://nginx:18080/stub_status
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - web

  node_exporter:
    # Host metrics: pid: host + ro binds of the host /proc, /sys and root so
    # the exporter reads HOST state while staying a normal bridge container
    # Prometheus can scrape (no port published — D15).
    image: prom/node-exporter:v1.8.2
    container_name: postharvest-node-exporter
    profiles: ["mon"]
    restart: unless-stopped
    init: true
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --no-collector.wifi
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - web

  cadvisor:
    # Container metrics. --port=8090 (8080 is go's on the isolated net).
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: postharvest-cadvisor
    profiles: ["mon"]
    restart: unless-stopped
    init: true
    privileged: true
    environment:
      # cadvisor's image-baked healthcheck wgets $CADVISOR_HEALTHCHECK_URL;
      # point it at the non-default port we run on (--port=8090).
      CADVISOR_HEALTHCHECK_URL: http://127.0.0.1:8090/healthz
    command:
      - --port=8090
      - --housekeeping_interval=10s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - web

volumes:
  certbot-www:
  certbot-conf:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  web:
  isolated:
    internal: true