# docker-compose.yml — PostHarvest (base = production topology)
#
# One compose file set serves BOTH local development and production:
#
#   LOCAL DEV  (auto-loaded docker-compose.override.yml):
#     docker compose up --build
#     -> backend  http://localhost:8000  (uvicorn --reload)
#        frontend http://localhost:3000  (next dev, hot reload)
#        postgres internal (no nginx)
#
#   PRODUCTION (this file, nginx via --profile prod; override ignored):
#     docker compose -f docker-compose.yml --profile prod up -d --build
#     -> nginx     :80/:443
#          /api/*  -> backend  (:8000 FastAPI)
#          /       -> frontend (:3000 Next.js standalone)
#        postgres  internal, isolated network
#
# Service wiring:
#   web       network: nginx, frontend, backend   (browser-facing path)
#   isolated  network: backend, redis, postgres   (internal: no route out)
#
# Playwright/Chromium is baked into the backend image. Job status/progress/
# cancel signals are mirrored to Redis (finalplanv2 §8b/§11 Phase 1); worker
# execution is still in-process threads, so the backend remains a single
# replica until the arq worker slice lands.
name: postharvest

services:
  # =====================================================================
  # nginx — production entrypoint only (profile "prod"; skipped in dev)
  # TLS via Let's Encrypt/certbot; see deploy/nginx/README for the flow.
  # =====================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: postharvest-nginx
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/locations.conf:/etc/nginx/snippets/locations.conf:ro
      - ../certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # Probe HTTPS loopback (full proxy chain) with cert verification disabled:
      # :80 only 301-redirects to https, and the Cloudflare origin cert is not
      # trusted by wget's CA store, so a plain --spider on :80 always fails.
      test: ["CMD", "wget", "-q", "--no-check-certificate", "--spider", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =====================================================================
  # backend — FastAPI on :8000 (Playwright + Chromium + exporters)
  # # Produ/deployment hardening (read-only rootfs, dropped caps) lives in
  # docker-compose.prod.yml so local dev keeps writable bind mounts.
  # =====================================================================
  backend:
    build:
      context: ..
      # Dockerfile lives inside docker/; COPY paths in it are root-relative.
      dockerfile: docker/Dockerfile
      target: backend
      # Build over the host network: Docker's default bridge resolver returns
      # only AAAA for some CDNs (e.g. cdn.playwright.dev) and this host has no
      # IPv6, so `playwright install` fails with EAI_AGAIN. Build-time only —
      # the running container keeps its normal isolated network.
      network: host
    image: postharvest-backend:latest
    container_name: postharvest-backend
    init: true
    # Never inherit LAN DNS: the local router mangles Google/Firebase answers
    # (IPv6-only, unroutable), which wedged Firebase Auth and Supabase.
    # Pinned public resolvers — same disease as the build-time workaround above.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Live session-capture browser (remote-debug CDP). The CDP endpoint is
    # bound to loopback INSIDE the container and deliberately NOT published:
    # the API proxies the DevTools frontend and bridges the websocket
    # (/api/accounts/capture/{id}/...), so one capture at a time app-wide and
    # zero exposed ports.
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/postharvest.db}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-postharvest-firebase}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      DATA_DIR: ${DATA_DIR:-/app/data}
      EXPORT_BASE_DIR: ${EXPORT_BASE_DIR:-/app/data/exports}
      WORKER_THREADS: ${WORKER_THREADS:-4}
      MAX_URLS_PER_JOB: ${MAX_URLS_PER_JOB:-100}
      CANCEL_WAIT_SECONDS: ${CANCEL_WAIT_SECONDS:-5.0}
      DEBUG: ${DEBUG:-false}
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost","https://postharvest.space"]}'
      SCRAPER_DELAY_SECONDS: ${SCRAPER_DELAY_SECONDS:-2.5}
      SCRAPER_TIMEOUT_SECONDS: ${SCRAPER_TIMEOUT_SECONDS:-20}
      SCRAPER_MAX_RETRIES: ${SCRAPER_MAX_RETRIES:-3}
      SCRAPER_ROBOTS: ${SCRAPER_ROBOTS:-1}
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY:-}
      # Comma-separated emails auto-promoted to the ops role on first login.
      OPS_EMAILS: ${OPS_EMAILS:-}
      # Max seconds a server-side personal Facebook login may run.
      PERSONAL_LOGIN_TIMEOUT_SECONDS: ${PERSONAL_LOGIN_TIMEOUT_SECONDS:-90.0}
      # Live session capture (loopback CDP; proxied same-origin by the API).
      SESSION_CAPTURE_PORT: ${SESSION_CAPTURE_PORT:-9333}
      SESSION_CAPTURE_TIMEOUT_SECONDS: ${SESSION_CAPTURE_TIMEOUT_SECONDS:-240.0}
      # Redis job-state mirror + cancel coordination (finalplanv2 §8b/§11).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Execution backend: inline (this process) | arq (separate worker).
      JOB_EXECUTION: ${JOB_EXECUTION:-inline}
      ARQ_QUEUE_NAME: ${ARQ_QUEUE_NAME:-arq:queue}
      ARQ_JOB_TIMEOUT_SECONDS: ${ARQ_JOB_TIMEOUT_SECONDS:-21600}
      # Role for role-aware Postgres pool sizing (api | worker).
      PROCESS_ROLE: ${PROCESS_ROLE:-api}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Bind-mount the repo data/ dir so the CLI (host) and the container share
      # the same cookie store / exports. Keep the file layout identical to
      # local `cli.py login` (data/fb_cookies_*.json, data/exports/...).
      - ../data:/app/data
    healthcheck:
      # python:3.13-slim has no curl/wget; urllib is guaranteed present.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - web
      - isolated

  # =====================================================================
  # redis — job state / cancel coordination (finalplanv2 §8b, §11 Phase 1)
  # Ephemeral coordination state only: status/progress mirrors + cancel
  # flags. No persistence (appendonly off) — Postgres owns durability, and a
  # Redis outage degrades every feature to pre-Redis DB-only behaviour.
  # Internal-only: lives on the `isolated` network with postgres, reachable
  # by nothing outside the stack.
  # =====================================================================
  redis:
    image: redis:7.4-alpine
    container_name: postharvest-redis
    init: true
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    networks:
      - isolated

  # =====================================================================
  # worker — optional out-of-process execution (JOB_EXECUTION=arq)
  # Same image as the backend, but runs the arq worker instead of the API
  # (finalplanv2 §8b/§11 Phase 1). Gated behind the `worker` profile so the
  # default single-process stack is unchanged; enable with:
  #   JOB_EXECUTION=arq docker compose --profile prod --profile worker up -d
  # It shares the backend's data volume (personal cookie jars) and DB/Redis
  # but serves no HTTP, so the API healthcheck is disabled.
  # =====================================================================
  worker:
    extends:
      service: backend
    container_name: postharvest-worker
    profiles:
      - worker
    command: ["arq", "backend.worker.WorkerSettings"]
    environment:
      JOB_EXECUTION: arq
      PROCESS_ROLE: worker
    healthcheck:
      disable: true

  # =====================================================================
  # frontend — Next.js standalone server on :3000
  # =====================================================================
  frontend:
    build:
      context: ..
      # Dockerfile lives inside docker/; COPY paths in it are root-relative.
      dockerfile: docker/Dockerfile
      target: frontend
      args:
        # Build-time only. In production the browser calls the SAME origin
        # (nginx /api/* -> backend), so empty = same-origin API_BASE — the
        # frontend already prefixes every request with /api/. Changing this
        # requires a rebuild.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://postharvest.space}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-postharvest-firebase}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    image: postharvest-frontend:latest
    container_name: postharvest-frontend
    init: true
    # Same pinned DNS as backend (see above) — the dev server must resolve
    # external hosts (fonts, Firebase) without the LAN resolver.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      # Documented for clarity; has no effect at runtime (baked at build).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - web

volumes:
  certbot-www:
  certbot-conf:

networks:
  web:
  isolated:
    internal: true