name: node-test

on:
  push:
    branches: [master, next, testing]
  pull_request:
    branches: [master, next, testing]

jobs:
  test:
    name: Node fetcher (vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: node

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Vitest
        run: npm run test